@if (isOpen) {
  <div class="dialog-backdrop" (click)="onBackdropClick()">
    <div class="dialog neo-card" (click)="onDialogClick($event)" [class.dialog-danger]="type === 'danger'" [class.dialog-warning]="type === 'warning'">
      <div class="dialog-header">
        <h2 class="dialog-title">{{ title }}</h2>
      </div>

      <div class="dialog-body">
        <p class="dialog-message">{{ message }}</p>
      </div>

      <div class="dialog-footer">
        <button class="neo-btn" (click)="onCancel()">
          {{ cancelText }}
        </button>
        <button
          class="neo-btn"
          [class.neo-btn-danger]="type === 'danger'"
          [class.neo-btn-primary]="type === 'info'"
          (click)="onConfirm()">
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
}
